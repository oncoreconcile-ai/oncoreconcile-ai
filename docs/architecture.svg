  <rect x="390" y="835" width="140" height="30" rx="6" fill="#e0e0e0" filter="url(#shadow)"/>
  <text x="460" y="855" text-anchor="middle" fill="#424242" font-size="11">Provenance</text>

  <rect x="550" y="835" width="140" height="30" rx="6" fill="#e0e0e0" filter="url(#shadow)"/>
