  <text x="70" y="310" fill="#e65100" font-size="11" font-weight="bold">EVIDENCE LAYER</text>

  <rect x="70" y="320" width="140" height="35" rx="6" fill="url(#evidenceGrad)" filter="url(#shadow)"/>
  <text x="140" y="342" text-anchor="middle" fill="#e65100" font-size="11">MyVariant.info</text>

