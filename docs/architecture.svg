  <rect x="70" y="100" width="140" height="35" rx="6" fill="url(#inputGrad)" filter="url(#shadow)"/>
  <text x="140" y="122" text-anchor="middle" fill="#1565c0" font-size="12">Manual Input</text>

  <rect x="240" y="100" width="140" height="35" rx="6" fill="url(#inputGrad)" filter="url(#shadow)"/>
  <text x="310" y="122" text-anchor="middle" fill="#1565c0" font-size="12">CSV Upload</text>

