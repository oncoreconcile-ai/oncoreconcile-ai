  <text x="230" y="938" fill="#757575" font-size="10">Molecular Dx Labs</text>
  <text x="370" y="938" fill="#757575" font-size="10">CROs</text>
  <text x="480" y="938" fill="#757575" font-size="10">Pharma</text>
  <text x="590" y="938" fill="#757575" font-size="10">Genomic KBs</text>
  <text x="720" y="938" fill="#757575" font-size="10">Healthcare AI</text>

